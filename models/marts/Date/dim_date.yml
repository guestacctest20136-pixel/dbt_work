version: 2

models:
  - name: dim_date
    description: "Dates calendar"
    columns:
      - name: trip_date
        description: "date"
        tests:
          - unique
          - not_null
      - name: year
        description: "Year"
        tests:
          - not_null
      - name: month
        description: "Month"
        tests:
          - not_null          
      - name: month_name
        description: "Month name"
        tests:
          - not_null 
      - name: quarter
        description: "Quarter"
        tests:
          - not_null 
      - name: day_of_week
        description: "Day of week"
        tests:
          - not_null 
      - name: day_of_week_num
        description: "day of week number"
        tests:
          - not_null 
      - name: is_weekend
        description: "is_weekend"
        tests:
          - not_null 
      - name: season
        description: "season"
        tests:
          - not_null 